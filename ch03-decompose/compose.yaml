# 第3章: LGTM オールインワンを個別サービスに分解する。
# Collector が OTLP でテレメトリを受け、メトリクス→Prometheus /
# ログ→Loki / トレース→Tempo に振り分け、Grafana で見る。
# image タグは versions.env の確定値でピン留めする。

services:
  # --- テレメトリの入口 ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC（アプリからテレメトリを送る）
      - "4318:4318"   # OTLP HTTP（同上）
    depends_on:
      # Prometheus は HTTP health を持つので healthy を待つ。
      # Loki / Tempo は distroless で health コマンドを持てないため起動開始を待つ。
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

  # --- メトリクス ---
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    # OTLP receiver を有効化して Collector からメトリクスを受ける。
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-otlp-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI / API（人間が触る口）
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- ログ ---
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    # コンテナ内 /loki への書き込み権限を確保するため root で起動する。
    # 検証用途の割り切り（Grafana 公式の compose example も同様）。
    user: "0"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      # Loki のデータはコンテナ内 /loki に置く。
      # 検証用途のため named volume は付けない。永続化は第11章で扱う。
    ports:
      - "3100:3100"   # Loki API（起動確認・LogQL クエリ）
    # Loki の image は distroless で wget/sh を持たないため healthcheck は付けない。
    # 起動確認はホストから `curl http://localhost:3100/ready` で行う。

  # --- トレース ---
  tempo:
    image: grafana/tempo:3.0.0
    container_name: tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo API（起動確認・TraceQL クエリ）
    # Tempo の image も distroless で healthcheck を持てない。
    # 起動確認はホストから `curl http://localhost:3200/ready` で行う。

  # --- 可視化 ---
  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    environment:
      # 検証用にサインアップ無効・匿名アクセスは無効のまま admin/admin。
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Grafana の UI を日本語表示にする。
      GF_USERS_DEFAULT_LANGUAGE: ja-JP
      # Grafana の UI をライトモード表示にする。
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana（ブラウザで開く）
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
