# 第4章: 第3章の分解版に node_exporter を足し、
# Prometheus が pull でホストメトリクスを収集する構成にする。
# image タグは versions.env の確定値でピン留めする。

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.154.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-otlp-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider",
             "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ホストメトリクスを公開する exporter。Prometheus が :9100 を scrape する。
  # ホスト rootfs のマウントは OS 差が大きいため、ここでは付けない
  # （macOS / Windows でも動く最小構成。Linux で本格的にホストを見るには
  #  --path.rootfs=/host と /:/host:ro のマウントを足す）。
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: node-exporter
    ports:
      - "9100:9100"   # /metrics（生のメトリクスを確認できる）

  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    user: "0"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:3.0.0
    container_name: tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Grafana の UI を日本語表示にする。
      GF_USERS_DEFAULT_LANGUAGE: ja-JP
      # Grafana の UI をライトモード表示にする。
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # provisioning の options.path が指すディレクトリに JSON を置く。
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
