# Grafana のデータソースを YAML で自動登録する（provisioning）。
# このファイルを /etc/grafana/provisioning/datasources/ にマウントすると、
# 起動時に Prometheus / Loki / Tempo が最初から繋がった状態になる。
# サービス名（prometheus / loki / tempo）が compose 内の DNS 名になる。

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
